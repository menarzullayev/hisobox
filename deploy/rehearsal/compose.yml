# Local rehearsal of the two-server database design (ADR-014, ADR-015, ADR-020).
# One machine, throwaway data, loopback ports only. Never used in production.
name: hb-rehearsal

x-postgres: &postgres
  build: ./postgres
  image: hb-rehearsal-postgres:16
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "qarz"]
    interval: 2s
    timeout: 2s
    retries: 60

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_DB: hiso_box
  POSTGRES_PASSWORD: ${HB_POSTGRES_PASSWORD:?run scripts/up.sh, which generates .env}
  HB_REPL_PASSWORD: ${HB_REPL_PASSWORD:?run scripts/up.sh, which generates .env}
  PGBACKREST_REPO1_CIPHER_PASS: ${HB_BACKUP_CIPHER_PASS:?run scripts/up.sh, which generates .env}

services:
  pg-primary:
    <<: *postgres
    environment:
      <<: *postgres-env
      HB_ROLE: primary
      HB_NODE: pg-primary
      HB_IGNORE_FENCE: ${HB_IGNORE_FENCE:-0}
    ports:
      - "127.0.0.1:${HB_PORT_PRIMARY:-55532}:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - backup-repo:/var/lib/pgbackrest
      - fence:/fence

  pg-standby:
    <<: *postgres
    environment:
      <<: *postgres-env
      HB_ROLE: standby
      HB_NODE: pg-standby
    ports:
      - "127.0.0.1:${HB_PORT_STANDBY:-55533}:5432"
    volumes:
      - standby-data:/var/lib/postgresql/data
      - backup-repo:/var/lib/pgbackrest
      - fence:/fence

  # Started only by scripts/pitr.sh. Its data lives in an anonymous volume
  # that is removed together with the container.
  pg-pitr:
    <<: *postgres
    profiles: ["pitr"]
    environment:
      <<: *postgres-env
      HB_ROLE: pitr
      HB_NODE: pg-pitr
      HB_PITR_TARGET: ${HB_PITR_TARGET:-}
      HB_PITR_TIMELINE: ${HB_PITR_TIMELINE:-}
    ports:
      - "127.0.0.1:${HB_PORT_PITR:-55534}:5432"
    volumes:
      - /var/lib/postgresql/data
      - backup-repo:/var/lib/pgbackrest

  filestore:
    build: ./filestore
    image: hb-rehearsal-filestore:1
    environment:
      GARAGE_RPC_SECRET: ${HB_FILESTORE_RPC_SECRET:?run scripts/up.sh, which generates .env}
      GARAGE_ADMIN_TOKEN: ${HB_FILESTORE_ADMIN_TOKEN:?run scripts/up.sh, which generates .env}
    ports:
      - "127.0.0.1:${HB_PORT_FILESTORE:-55900}:3900"
    volumes:
      - filestore-meta:/var/lib/garage/meta
      - filestore-data:/var/lib/garage/data

volumes:
  primary-data:
  standby-data:
  backup-repo:
  fence:
  filestore-meta:
  filestore-data:
