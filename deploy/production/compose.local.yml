# Overlay for the proof on a developer machine ONLY (scripts/local.sh). Never used on a server.
# Adds what the real deployment keeps on the database hosts: a throwaway PostgreSQL and, in place of the
# S3 store, a directory on a volume.
services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hiso_box
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?run scripts/local.sh, which generates the env file}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "qarz"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - db:/var/lib/postgresql/data
    networks: [egress]

  migrate:
    depends_on:
      db:
        condition: service_healthy

  # The migrations create the roles `hb_app`, `hb_admin` and `hb_worker` without a login; a server gets
  # their passwords from the operator once. Here a one-shot does it, each role with its own.
  local-role:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${LOCAL_POSTGRES_PASSWORD:?}
      LOCAL_APP_PASSWORD: ${LOCAL_APP_PASSWORD:?}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?}
      LOCAL_WORKER_PASSWORD: ${LOCAL_WORKER_PASSWORD:?}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -q -h db -U postgres -d qarz -v ON_ERROR_STOP=1 \
          -v app="$$LOCAL_APP_PASSWORD" -v admin="$$LOCAL_ADMIN_PASSWORD" -v worker="$$LOCAL_WORKER_PASSWORD" <<'SQL'
        ALTER ROLE hb_app LOGIN PASSWORD :'app';
        ALTER ROLE hb_admin LOGIN PASSWORD :'admin';
        ALTER ROLE hb_worker LOGIN PASSWORD :'worker';
        SQL
    networks: [egress]

  api:
    depends_on:
      local-role:
        condition: service_completed_successfully
    volumes:
      - files:/var/lib/hiso_box/files

  worker:
    depends_on:
      local-role:
        condition: service_completed_successfully
    volumes:
      - files:/var/lib/hiso_box/files

volumes:
  db: {}
  files: {}
