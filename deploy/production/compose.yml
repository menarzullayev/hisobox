# The application host: proxy, API, worker, and the one-shot migration.
#
# NOT here, by design (ADR-014, ADR-015, ADR-020): PostgreSQL and the file store. They live on the
# database hosts; these services reach them through HB_DATABASE_URL, HB_ADMIN_DATABASE_URL,
# HB_WORKER_DATABASE_URL, HB_MIGRATION_URL and HB_S3_*.
#
# Settings come from an env file that is not in the repository (see .env.example), given with
# `docker compose --env-file`. The scripts in scripts/ do that; run them, not compose by hand.
# Each service is given only the names it reads: the owner connection goes to `migrate` alone, and
# each part of the application gets the connection of its own database role and no other (the API:
# hb_app, and hb_admin for the administrators' side; the worker: hb_worker).
name: hiso-box

x-defaults: &defaults
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    # Rotated by size on the host: at most 10 files of 20 MB a service. The operations document asks for
    # 30 days; size rotation does not promise a number of days (see the README).
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

x-backend-image: &backend-image
  image: ${DEPLOY_BACKEND_IMAGE:-hiso_box/backend}:${DEPLOY_RELEASE:?set DEPLOY_RELEASE to the commit to run}
  build:
    context: ../../backend

# Read by both the API and the worker. No database connection is shared: each has its own role.
x-shared-env: &shared-env
  HB_BOT_TOKEN: ${HB_BOT_TOKEN:-}
  HB_FILE_STORE: ${HB_FILE_STORE:-}
  HB_FILE_ROOT: ${HB_FILE_ROOT:-}
  HB_S3_ENDPOINT: ${HB_S3_ENDPOINT:-}
  HB_S3_BUCKET: ${HB_S3_BUCKET:-}
  HB_S3_REGION: ${HB_S3_REGION:-us-east-1}
  HB_S3_ACCESS_KEY: ${HB_S3_ACCESS_KEY:-}
  HB_S3_SECRET_KEY: ${HB_S3_SECRET_KEY:-}

services:
  migrate:
    <<: [*defaults, *backend-image]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      HB_MIGRATION_URL: ${HB_MIGRATION_URL:?HB_MIGRATION_URL is not set}
    networks: [egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  api:
    <<: [*defaults, *backend-image]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    environment:
      <<: *shared-env
      HB_DATABASE_URL: ${HB_DATABASE_URL:?HB_DATABASE_URL is not set}
      # The administrators' side. Needed as soon as HB_ADMIN_TG_IDS names somebody: the API then
      # refuses to start without it.
      HB_ADMIN_DATABASE_URL: ${HB_ADMIN_DATABASE_URL:-}
      HB_WEBHOOK_SECRET: ${HB_WEBHOOK_SECRET:-}
      HB_SECRETS_KEY: ${HB_SECRETS_KEY:-}
      HB_SECRETS_KEY_PREVIOUS: ${HB_SECRETS_KEY_PREVIOUS:-}
      HB_ADMIN_TG_IDS: ${HB_ADMIN_TG_IDS:-}
      # `required` unless the env file says `off`; anything else and the API refuses to start.
      HB_ADMIN_SECOND_FACTOR: ${HB_ADMIN_SECOND_FACTOR:-required}
      # The public host administrators' passkeys are made for. Empty: there are no passkeys.
      HB_PASSKEY_HOST: ${HB_PASSKEY_HOST:-}
      HB_METRICS_TOKEN: ${HB_METRICS_TOKEN:-}
      HB_RATE_USER_PER_MINUTE: ${HB_RATE_USER_PER_MINUTE:-120}
      HB_RATE_USER_BURST: ${HB_RATE_USER_BURST:-60}
      HB_RATE_SHOP_PER_MINUTE: ${HB_RATE_SHOP_PER_MINUTE:-600}
      HB_RATE_SHOP_BURST: ${HB_RATE_SHOP_BURST:-200}
      HB_WEB_LOGIN_MAX_AGE_SECONDS: ${HB_WEB_LOGIN_MAX_AGE_SECONDS:-300}
      HB_STATEMENT_TIMEOUT_MS: ${HB_STATEMENT_TIMEOUT_MS:-5000}
      HB_PAYME_MERCHANT_ID: ${HB_PAYME_MERCHANT_ID:-}
      HB_PAYME_SECRET_KEY: ${HB_PAYME_SECRET_KEY:-}
      HB_CLICK_SERVICE_ID: ${HB_CLICK_SERVICE_ID:-}
      HB_CLICK_MERCHANT_ID: ${HB_CLICK_MERCHANT_ID:-}
      HB_CLICK_SECRET_KEY: ${HB_CLICK_SECRET_KEY:-}
    # The image's own health check (GET /healthz inside the container) applies.
    networks: [edge, egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  worker:
    <<: [*defaults, *backend-image]
    command: ["python", "-m", "hiso_box.interface.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    # The worker listens on nothing, so the image's HTTP check does not apply and is switched off. A
    # worker that died is restarted by the restart policy; one that runs but does no work shows in the
    # API's metrics (hb_job_last_finished_seconds, hb_outbox_oldest_due_seconds), not here. The worker
    # watches the rest of the service and tells the operators' chat (DEC-078); nothing watches it.
    healthcheck:
      disable: true
    environment:
      <<: *shared-env
      HB_WORKER_DATABASE_URL: ${HB_WORKER_DATABASE_URL:?HB_WORKER_DATABASE_URL is not set}
      HB_WORKER_STATEMENT_TIMEOUT_MS: ${HB_WORKER_STATEMENT_TIMEOUT_MS:-60000}
      # The administrators' allow-list, as the API has it: the worker sends a subscription receipt's
      # file with its announcement to these people's chats and to the review group, and to nobody else.
      # Without it the administrators get the announcement as text, the group still gets the file.
      HB_ADMIN_TG_IDS: ${HB_ADMIN_TG_IDS:-}
      # The SMS provider's account. The worker alone sends, so the API is not given it.
      HB_ESKIZ_EMAIL: ${HB_ESKIZ_EMAIL:-}
      HB_ESKIZ_PASSWORD: ${HB_ESKIZ_PASSWORD:-}
      HB_ESKIZ_SENDER: ${HB_ESKIZ_SENDER:-}
      # The operations watch (DEC-078): whom it tells, and what it reads besides the database. The
      # metrics token lets it read the API's counters (error rate, security events); counts only.
      HB_ALERT_CHAT_IDS: ${HB_ALERT_CHAT_IDS:-}
      HB_ALERT_API_URL: ${HB_ALERT_API_URL:-}
      HB_ALERT_BACKUP_FIGURES_DIR: ${HB_ALERT_BACKUP_FIGURES_DIR:-}
      HB_ALERT_FILES_FIGURES_DIR: ${HB_ALERT_FILES_FIGURES_DIR:-}
      HB_ALERT_DISK_PATHS: ${HB_ALERT_DISK_PATHS:-}
      HB_METRICS_TOKEN: ${HB_METRICS_TOKEN:-}
    networks: [egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256

  proxy:
    <<: *defaults
    image: ${DEPLOY_PROXY_IMAGE:-hiso_box/proxy}:${DEPLOY_RELEASE:?set DEPLOY_RELEASE to the commit to run}
    build:
      context: ../..
      dockerfile: deploy/production/nginx/Dockerfile
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
        # The site's own address, as the public landing page's canonical link, its sharing card and its
        # sitemap are made from it (frontend/src/web/seo.ts). A deployment sets it to the same name as
        # DEPLOY_PUBLIC_HOST; empty, the page carries no canonical link and no sitemap, and the build
        # says so rather than guessing a host.
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # The only published ports of the whole file.
    ports:
      - "${DEPLOY_BIND:-0.0.0.0}:${DEPLOY_HTTP_PORT:-80}:8080"
      - "${DEPLOY_BIND:-0.0.0.0}:${DEPLOY_HTTPS_PORT:-443}:8443"
    volumes:
      - ${DEPLOY_TLS_DIR:-/etc/hiso_box/tls}:/etc/nginx/tls:ro
      - ${DEPLOY_ACME_DIR:-/var/lib/hiso_box/acme}:/var/www/acme:ro
    networks: [public, edge]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192M
          pids: 128

networks:
  # The proxy's way out to the published ports.
  public: {}
  # Proxy to API only; no route to anywhere else.
  edge:
    internal: true
  # API and worker to the database hosts, the file store and Telegram.
  egress: {}
