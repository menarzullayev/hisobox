# Included at http level by both forms of the proxy (conf.d/hiso-box.conf, single-host.d/hiso-box.conf).
#
# Limits by client address. The application has its own limits per signed-in user and per shop
# (HB_RATE_*); these stand in front of them and also cover callers who are not signed in.
# Mobile operators put many subscribers behind one address, so the general limit is generous.
limit_req_zone $binary_remote_addr zone=hb_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hb_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hb_pay:10m rate=5r/s;
# The read behind a customer's secret link, which nobody signs in to: a strict zone of its own, like
# sign-in's, so that the route cannot be flooded and trying secrets costs time. Twice the rate of
# sign-in: the customers of one shop are sent their links together, and many of them reach the
# service from one mobile operator's address.
limit_req_zone $binary_remote_addr zone=hb_share:10m rate=60r/m;
# Telegram delivers every shop's updates from a handful of addresses, so this zone is wider than the
# general one, not narrower; the route is narrowed in other ways (POST only, optional address list).
limit_req_zone $binary_remote_addr zone=hb_webhook:10m rate=30r/s;
# The pages and their files: static, hashed and cached, and one page is a document and a dozen files.
# Held to the general limit, two pages opened in one second were refused their scripts and stayed blank.
limit_req_zone $binary_remote_addr zone=hb_static:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=hb_conn:10m;
limit_req_status 429;
limit_conn_status 429;
