[alembic]
script_location = migrations
# The connection string comes from HB_MIGRATION_URL (see migrations/env.py); migrations run as the owner
# role, never as hb_app.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
